apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: splunk-uf
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: splunk-uf
    namespace: flux-system
  postBuild:
    substitute:
      splunk_efs_id: ${EFS_ID}
      splunk_access_point_id: ${EFS_ONE_EFS_ACCESS_POINT_ID}
